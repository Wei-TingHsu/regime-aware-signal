# =============================================================================
# Regime-Aware Cross-Asset Signal Framework — Master Configuration
# =============================================================================
# Single source of truth. Every script reads from this file.
# If you find yourself hard-coding a ticker or date in a script, stop and put
# it here instead. The reproducibility discipline depends on this rule.
# =============================================================================

project:
  name: regime-aware-signal
  version: 0.1.0
  random_seed: 42                  # fixed for reproducibility everywhere

# -----------------------------------------------------------------------------
# Date ranges
# -----------------------------------------------------------------------------
dates:
  panel_start: "1995-01-01"        # macro panel start; covers all crisis episodes
  panel_end: null                  # null = today; pipeline fills this dynamically

# -----------------------------------------------------------------------------
# Asset universe (locked, with justification per instrument)
# -----------------------------------------------------------------------------
assets:
  # Macro risk backbone — always-on; doubles as regime signal
  macro_risk:
    - {ticker: "SPY",  role: "equity_risk",     since: "1993-01-29"}
    - {ticker: "TLT",  role: "long_treasuries", since: "2002-07-30"}
    - {ticker: "GLD",  role: "gold_etf",        since: "2004-11-18"}

  # Inversion study (Problem 1) — six-variable safe-haven panel
  inversion:
    - {ticker: "GLD",  role: "gold"}
    - {ticker: "USO",  role: "oil_etf",       since: "2006-04-10"}
    - {ticker: "UUP",  role: "usd_index_etf", since: "2007-02-20"}
    # The other three (real yields, M2, liquidity-stress) come from FRED below

  # Semiconductor chain (Problem 2 deep-dive) — proxy basket
  semi_chain:
    - {ticker: "NVDA", role: "gpu_design"}
    - {ticker: "AMD",  role: "gpu_design"}
    - {ticker: "MU",   role: "memory_dram_hbm"}
    - {ticker: "AMKR", role: "packaging"}
    - {ticker: "VRT",  role: "dc_power"}

# -----------------------------------------------------------------------------
# FRED macro series — the regime engine's input panel
# -----------------------------------------------------------------------------
fred_series:
  # Rates and curve
  - {id: "DGS10",      role: "nominal_10y_yield",  freq: "daily",   since: "1962-01-02"}
  - {id: "DFII10",     role: "real_10y_yield",     freq: "daily",   since: "2003-01-02"}
  - {id: "T10Y2Y",     role: "term_spread_10y2y",  freq: "daily",   since: "1976-06-01"}
  - {id: "DGS2",       role: "nominal_2y_yield",   freq: "daily",   since: "1976-06-01"}

  # Money and liquidity
  - {id: "M2SL",       role: "m2_money_supply",    freq: "monthly", since: "1959-01-01"}
  - {id: "EFFR",       role: "effective_ff_rate",  freq: "daily",   since: "1954-07-01"}
  - {id: "SOFR",       role: "sofr",               freq: "daily",   since: "2018-04-03"}

  # Credit and stress
  - {id: "BAMLH0A0HYM2", role: "hy_credit_spread", freq: "daily",   since: "1996-12-31"}
  - {id: "VIXCLS",       role: "vix",              freq: "daily",   since: "1990-01-02"}

  # Dollar
  - {id: "DTWEXBGS",   role: "broad_usd_index",    freq: "daily",   since: "2006-01-02"}

# -----------------------------------------------------------------------------
# Model hyperparameters
# -----------------------------------------------------------------------------
pca:
  n_components: 5                  # try 3-5; 5 is the upper bound we'll inspect
  standardize: true

regime:
  method: "gmm"                    # gaussian_mixture; "kmeans" as alternative
  candidate_n_regimes: [3, 4, 5]   # BIC will pick among these
  covariance_type: "full"
  max_iter: 200
  n_init: 10                       # multiple inits, pick best — stability

analog:
  recency_decay_lambda: 0.0008     # ~daily; small = gentle decay
  similarity_sigma: 1.5            # in PCA z-score space
  weighting: "similarity_dominant" # 'multiplicative' is the alternative

backtest:
  horizons_days: [5, 20, 60]       # forecast horizons in trading days

# -----------------------------------------------------------------------------
# Crisis episodes (graded — systemic + asset-specific)
# Used for backtest validation and regime cluster sanity-checking
# -----------------------------------------------------------------------------
crisis_episodes:
  - {name: "1998_LTCM",          start: "1998-08-01", end: "1998-10-31", severity: "systemic"}
  - {name: "2000_dotcom",        start: "2000-03-01", end: "2002-10-31", severity: "systemic"}
  - {name: "2008_GFC",           start: "2007-07-01", end: "2009-03-31", severity: "systemic"}
  - {name: "2011_eurodebt",      start: "2011-07-01", end: "2011-10-31", severity: "regional"}
  - {name: "2015_china_devalue", start: "2015-08-01", end: "2016-02-29", severity: "regional"}
  - {name: "2018Q4_vol",         start: "2018-10-01", end: "2018-12-31", severity: "regional"}
  - {name: "2020_covid",         start: "2020-02-15", end: "2020-04-30", severity: "systemic"}
  - {name: "2022_rate_shock",    start: "2022-01-01", end: "2022-10-31", severity: "regional"}
  - {name: "2026_silver_feb",    start: "2026-02-01", end: "2026-04-30", severity: "asset_specific"}