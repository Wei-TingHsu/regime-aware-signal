# Pre-registered forward-test models -- FROZEN 2026-08-14.
# Specs locked BEFORE any live data existed. Do not edit; add new models instead.
# In-sample numbers are from src/model_grid.py (frozen n=4 regimes, full permutation).

models:
  model_1_baseline:
    horizon: 5
    sim_mode: level
    kernel: gaussian
    sigma: 1.5
    trend_window: 10
    n_regimes: 4
    topk: 100
    nbasket: 5
    note: "Plain macro engine, level-only similarity. In-sample Sharpe +0.21, p=0.0869 (not significant)."

  model_2_horizon_trend:
    horizon: 10
    sim_mode: trend
    kernel: gaussian
    sigma: 1.5
    trend_window: 10
    n_regimes: 4
    topk: 100
    nbasket: 5
    note: "PRINCIPLED amendment: longer horizon + trend-aware similarity (macro direction, not just level). Hypothesis-driven. In-sample Sharpe +0.39, p=0.0190 (significant)."

  model_3_overfit:
    horizon: 20
    sim_mode: trend
    kernel: gaussian
    sigma: 1.0
    trend_window: 10
    n_regimes: 4
    topk: 100
    nbasket: 5
    note: "CONTROL GROUP -- best-in-sample of 48 grid configs, explicitly CHERRY-PICKED. In-sample Sharpe +0.50, p=0.0390. Hypothesis: its in-sample lead shrinks or inverts out-of-sample."

# ===========================================================================
# EXPERIMENTAL / BACKTEST-ONLY MODELS
# ===========================================================================
# SPLIT OUT OF `models:` 2026-08-24. These four entries were added under
# `models:` on 08-23. forward_log.load_models() reads `models:`, so the next
# forward_log run -- the first since they were added -- would have logged all
# seven models live. And because picks_for() passed no age_years to _kw(), the
# recency term never applied: all four would have produced picks BIT-IDENTICAL
# to model_1_baseline under four different names, in a scoreboard presenting
# them as forward-tested recency variants.
#
# Nothing here is read by the live forward test. Adding entries below is free.
# Editing anything under `models:` above changes config/models.frozen.sha256
# and every loader refuses to run.
#
# See docs/prereg_recency_kernel.md sections 3, 5 and 7.
# ===========================================================================

backtest_models:

  # NEW entries only. model_1/2/3 above are FROZEN pre-registration for the
  # live forward test (ce18d34) and are not edited. These are backtest-only
  # until forward-test evidence exists. See docs/prereg_recency_kernel.md.
  model_1_recency_hl4:
    horizon: 5
    sim_mode: level
    half_life_years: 4
    note: "primary rung. exp decay, HL=4y (US presidential term)."
  model_1_recency_hl2:
    horizon: 5
    sim_mode: level
    half_life_years: 2
    note: "ladder rung"
  model_1_recency_hl8:
    horizon: 5
    sim_mode: level
    half_life_years: 8
    note: "ladder rung. Fed chair tenure anchor."
  model_1_recency_hl16:
    horizon: 5
    sim_mode: level
    half_life_years: 16
    note: "ladder rung"
